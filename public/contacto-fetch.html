<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto con fetch</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/contacto-fetch.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Nivel 3</p>
      <h1>Contacto sin recargar</h1>
      <p>Envias los datos con fetch y ves la respuesta en la misma pagina.</p>
      <form id="contact-form" class="contact-form">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" required />

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Enviar con fetch</button>
      </form>
      <p id="response" class="message" aria-live="polite"></p>
      <nav style="margin-top: 1.25rem;">
        <a href="/">Inicio</a>
      </nav>
    </main>
  </body>
</html>
